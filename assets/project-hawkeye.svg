<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="HawkEye AI: 265 ms frame to alert">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#131A23" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="75%" cy="50%" r="45%"><stop offset="0" stop-color="#16C2B0" stop-opacity=".16"/><stop offset="1" stop-color="#16C2B0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FF0E3"/></linearGradient>
  <clipPath id="frame"><rect width="600" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="600" height="200" fill="#07090D"/>
  <rect width="600" height="200" fill="url(#grid)"/>
  <rect width="600" height="200" fill="url(#glow)"/>
  <rect x="28" y="34" width="136" height="24" rx="12" fill="#16C2B0" opacity=".12"/>
  <rect x="28" y="34" width="136" height="24" rx="12" fill="none" stroke="#16C2B0" stroke-opacity=".5"/>
  <text x="40" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing=".5" font-weight="700" fill="#5EEAD4">DEFENSE / THERMAL</text>
  <text x="28" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.6" fill="#FFFFFF">HawkEye AI</text>
  <text x="28" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#F5B544">265 ms frame to alert</text>
  <rect x="28" y="160" width="0" height="2" rx="1" fill="#F5B544"><animate attributeName="width" values="0;60;60" keyTimes="0;.25;1" dur="4s" repeatCount="indefinite"/></rect>
<defs><radialGradient id="heat" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".35" stop-color="#F59E0B"/><stop offset=".7" stop-color="#B91C1C" stop-opacity=".6"/><stop offset="1" stop-color="#3B0764" stop-opacity="0"/></radialGradient></defs>
<rect x="350" y="34" width="226" height="130" rx="8" fill="#140A24"/>
<ellipse cx="420" cy="108" rx="9" ry="20" fill="url(#heat)"><animate attributeName="cx" values="410;440;410" dur="8s" repeatCount="indefinite"/></ellipse>
<ellipse cx="520" cy="90" rx="6" ry="13" fill="url(#heat)"/>
<rect x="404" y="82" width="34" height="52" fill="none" stroke="#22C55E" stroke-width="1.5"><animate attributeName="x" values="394;424;394" dur="8s" repeatCount="indefinite"/></rect>
<rect x="510" y="72" width="22" height="36" fill="none" stroke="#F87171" stroke-width="1.5"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="521" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#F87171">HIGH</text>
<rect x="350" y="34" width="226" height="2" fill="#5EEAD4" opacity=".6"><animate attributeName="y" values="34;162;34" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="-200" y="0" width="200" height="200" fill="url(#sweep)">
    <animate attributeName="x" values="-200;600" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="599" height="199" rx="16" fill="none" stroke="#1E2935"/>
</svg>
