<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="03. Results ledger">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#131A23" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="0%" cy="50%" r="45%"><stop offset="0" stop-color="#16C2B0" stop-opacity=".18"/><stop offset="1" stop-color="#16C2B0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FF0E3"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="92" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="92" fill="#07090D"/>
  <rect width="1200" height="92" fill="url(#grid)"/>
  <rect width="1200" height="92" fill="url(#glow)"/>
  <text x="40" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="34" font-weight="700" fill="none" stroke="#5EEAD4" stroke-width="1.2">03</text>
  <line x1="118" y1="26" x2="118" y2="66" stroke="#1E2935"/>
  <text x="142" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-.4" fill="#FFFFFF">Results ledger</text>
  <text x="1160" y="54" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2.2" fill="#5B6878">EVERY NUMBER, AND HOW IT WAS MEASURED</text>
  <rect x="142" y="72" width="0" height="2" rx="1" fill="#5EEAD4"><animate attributeName="width" values="0;120;120" keyTimes="0;.3;1" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="-400" y="0" width="400" height="92" fill="url(#sweep)">
    <animate attributeName="x" values="-400;1200" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="1199" height="91" rx="16" fill="none" stroke="#1E2935"/>
</svg>
