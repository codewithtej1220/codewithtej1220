  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.4s" dur=".7s" fill="freeze"/>
    <text x="750" y="76" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#FFFFFF">97.3<tspan font-size="24" fill="#5EEAD4">%</tspan></text>
    <text x="750" y="106" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#C3CCD7">precision on agent failures</text>
    <text x="750" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#5B6878">AGENT OBSERVABILITY</text>
    <rect x="660" y="146" width="180" height="3" rx="1.5" fill="#1E2935"/>
    <rect x="660" y="146" width="0" height="3" rx="1.5" fill="#5EEAD4"><animate attributeName="width" from="0" to="175" begin="0.7s" dur="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur=".7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6s" dur=".7s" fill="freeze"/>
    <text x="1050" y="76" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#FFFFFF">265<tspan font-size="24" fill="#5EEAD4"> ms</tspan></text>
