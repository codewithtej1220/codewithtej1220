  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.2s" dur=".7s" fill="freeze"/>
    <text x="450" y="76" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#FFFFFF">0.992<tspan font-size="24" fill="#5EEAD4"></tspan></text>
    <text x="450" y="106" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#C3CCD7">F0.5 on entity resolution</text>
    <text x="450" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#5B6878">AMAZON ML CHALLENGE 2026</text>
    <rect x="360" y="146" width="180" height="3" rx="1.5" fill="#1E2935"/>
