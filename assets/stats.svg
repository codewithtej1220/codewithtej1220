<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="1st of 45 teams at TCS Tech Day; F0.5 0.992 at Amazon ML Challenge 2026; 97.3% precision on agent failures; 265 ms thermal frame to dashboard">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#131A23" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="45%"><stop offset="0" stop-color="#16C2B0" stop-opacity=".08"/><stop offset="1" stop-color="#16C2B0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FF0E3"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="176" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
