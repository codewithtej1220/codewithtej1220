    <rect x="960" y="146" width="180" height="3" rx="1.5" fill="#1E2935"/>
    <rect x="960" y="146" width="0" height="3" rx="1.5" fill="#5EEAD4"><animate attributeName="width" from="0" to="133" begin="0.9s" dur="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
  </g>
  <rect x="-400" y="0" width="400" height="176" fill="url(#sweep)">
    <animate attributeName="x" values="-400;1200" dur="9s" repeatCount="indefinite"/>
