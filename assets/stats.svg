    <text x="150" y="106" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#C3CCD7">of 45 teams, TCS Tech Day</text>
    <text x="150" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#5B6878">PROMOFORGE / JNTUH</text>
    <rect x="60" y="146" width="180" height="3" rx="1.5" fill="#1E2935"/>
