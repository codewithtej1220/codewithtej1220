<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="QuantaVerse: 8 modules, in-browser">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#131A23" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="75%" cy="50%" r="45%"><stop offset="0" stop-color="#16C2B0" stop-opacity=".16"/><stop offset="1" stop-color="#16C2B0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FF0E3"/></linearGradient>
  <clipPath id="frame"><rect width="600" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="600" height="200" fill="#07090D"/>
  <rect width="600" height="200" fill="url(#grid)"/>
  <rect width="600" height="200" fill="url(#glow)"/>
  <rect x="28" y="34" width="156" height="24" rx="12" fill="#16C2B0" opacity=".12"/>
  <rect x="28" y="34" width="156" height="24" rx="12" fill="none" stroke="#16C2B0" stroke-opacity=".5"/>
  <text x="40" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing=".5" font-weight="700" fill="#5EEAD4">SIH 2026 / NATIONALS</text>
  <text x="28" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.6" fill="#FFFFFF">QuantaVerse</text>
  <text x="28" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#F5B544">8 modules, in-browser</text>
  <rect x="28" y="160" width="0" height="2" rx="1" fill="#F5B544"><animate attributeName="width" values="0;60;60" keyTimes="0;.25;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="465" cy="100" r="58" fill="none" stroke="#16C2B0" stroke-width="1.5" opacity=".7"/>
<ellipse cx="465" cy="100" rx="58" ry="18" fill="none" stroke="#16C2B0" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>
<line x1="465" y1="30" x2="465" y2="170" stroke="#1E2935"/>
<text x="465" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5B6878">|0&gt;</text>
<text x="465" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#5B6878">|1&gt;</text>
<g><animateTransform attributeName="transform" type="rotate" from="0 465 100" to="360 465 100" dur="6s" repeatCount="indefinite"/>
<line x1="465" y1="100" x2="499" y2="56" stroke="#F5B544" stroke-width="2.5"/><circle cx="499" cy="56" r="5" fill="#F5B544"/></g>
<circle cx="465" cy="100" r="3" fill="#FFFFFF"/>
  <rect x="-200" y="0" width="200" height="200" fill="url(#sweep)">
    <animate attributeName="x" values="-200;600" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="599" height="199" rx="16" fill="none" stroke="#1E2935"/>
</svg>
